openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: 1.0.0
  description: Read-only, portfolio-scoped holdings and immutable valuation snapshot view.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Start an authenticated session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials or throttled login }
        '403': { description: Cross-origin request rejected }
  /api/v1/auth/session:
    get:
      summary: Bootstrap the current session
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: No valid session }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Session ended }
        '401': { description: No valid session }
        '403': { description: Invalid CSRF token or cross-origin request }
  /api/v1/portfolios/{portfolioId}/overview:
    get:
      summary: Read one portfolio overview
      description: Returns source-traceable lots and the latest immutable snapshot. Reporting currency changes only this read view.
      operationId: getPortfolioOverview
      security: [{ sessionCookie: [] }]
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: string }
        - name: currency
          in: query
          required: false
          description: Three-letter reporting currency; defaults to MYR.
          schema: { type: string, pattern: '^[A-Za-z]{3}$', default: MYR, example: USD }
      responses:
        '200':
          description: Portfolio overview. A no_snapshot or incomplete state is explicit and does not include a fabricated total.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioOverview' }
        '400':
          description: Invalid reporting currency.
        '401':
          description: Authentication is required. The response is never cacheable.
        '403':
          description: Cross-origin or CSRF validation failed.
        '404':
          description: Portfolio or API route not found.
        '405':
          description: Read-only endpoint does not accept mutation methods.
        '500':
          description: Internal server error.
  /api/v1/portfolios/{portfolioId}/activity:
    get:
      summary: Read authenticated portfolio activity
      description: Returns safe, portfolio-scoped activity summaries in deterministic newest-first order. Raw audit payloads are never returned.
      operationId: getPortfolioActivity
      security: [{ sessionCookie: [] }]
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque signed cursor returned by the previous page. It encodes the occurred_at/id keyset position.
          schema: { type: string, minLength: 16, maxLength: 512 }
      responses:
        '200': { description: Activity page, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { description: Malformed or out-of-bounds pagination }
        '401': { description: Authentication is required; response is never cacheable }
        '404': { description: Portfolio or API route not found }
        '405': { description: Read-only endpoint does not accept mutation methods }
        '500': { description: Internal server error }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}/thesis:
    get:
      summary: Read the current investment thesis for a holding
      operationId: getHoldingThesis
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200': { description: Current thesis, content: { application/json: { schema: { $ref: '#/components/schemas/Thesis' } } } }
        '401': { description: Authentication is required; response is never cacheable }
        '404': { description: Portfolio, holding, or thesis not found }
    put:
      summary: Create or replace a holding investment thesis
      operationId: putHoldingThesis
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThesisUpdate' }
      responses:
        '200': { description: Accepted current thesis, content: { application/json: { schema: { $ref: '#/components/schemas/Thesis' } } } }
        '400': { description: Strict request or field validation failed }
        '401': { description: Authentication is required }
        '403': { description: Invalid CSRF token or cross-origin request }
        '404': { description: Portfolio or holding not found }
        '409': { description: Optimistic concurrency conflict }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}/thesis/history:
    get:
      summary: Read immutable thesis revision history
      operationId: getHoldingThesisHistory
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200': { description: Oldest-first immutable revisions, content: { application/json: { schema: { $ref: '#/components/schemas/ThesisHistory' } } } }
        '401': { description: Authentication is required }
        '404': { description: Portfolio, holding, or thesis not found }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portfolio_session
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    Session:
      type: object
      required: [authenticated, csrf_token, expires_at]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string, description: In-memory token for unsafe same-origin API requests. }
        expires_at: { type: string, format: date-time }
    PortfolioOverview:
      type: object
      required: [portfolio, reporting_currency, snapshot, allocation, holdings]
      properties:
        portfolio: { $ref: '#/components/schemas/Portfolio' }
        reporting_currency: { type: string, example: MYR }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
        allocation: { $ref: '#/components/schemas/Allocation' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
    Portfolio:
      type: object
      required: [id, name, default_reporting_currency]
      properties:
        id: { type: string }
        name: { type: string }
        default_reporting_currency: { type: string }
    Snapshot:
      type: object
      required: [state, complete, subtotals]
      properties:
        state: { type: string, enum: [complete, incomplete, no_snapshot] }
        snapshot_id: { type: string }
        calculation_version: { type: string }
        created_at: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
        complete: { type: boolean }
        reporting_total: { type: string, description: Decimal string; present only when complete. }
        missing_dependencies: { type: array, items: { type: string } }
        stale_dependencies: { type: array, items: { type: string } }
        invalid_dependencies: { type: array, items: { type: string } }
        source_timestamps: { type: array, items: { type: string, format: date-time } }
        subtotals:
          type: array
          items: { $ref: '#/components/schemas/CurrencySubtotal' }
    CurrencySubtotal:
      type: object
      required: [currency, market_value]
      properties:
        currency: { type: string }
        market_value: { type: string }
        cost_basis: { type: string }
        unrealised_pnl: { type: string }
    Allocation:
      type: object
      required: [state, coverage]
      description: Complete distributions are emitted only when every lot has a reporting value. Partial and unavailable states omit distribution slices.
      properties:
        state: { type: string, enum: [complete, partial, unavailable] }
        coverage: { $ref: '#/components/schemas/AllocationCoverage' }
        by_instrument:
          type: array
          items: { $ref: '#/components/schemas/InstrumentAllocation' }
        by_source_currency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyAllocation' }
    AllocationCoverage:
      type: object
      required: [total_lots, valued_lots, missing_dependencies, stale_dependencies, invalid_dependencies]
      properties:
        total_lots: { type: integer, minimum: 0 }
        valued_lots: { type: integer, minimum: 0 }
        missing_dependencies: { type: integer, minimum: 0 }
        stale_dependencies: { type: integer, minimum: 0 }
        invalid_dependencies: { type: integer, minimum: 0 }
    InstrumentAllocation:
      type: object
      required: [symbol, source_currency, value, percentage]
      properties:
        instrument_id: { type: string }
        symbol: { type: string }
        source_currency: { type: string, description: Original holding currency, included to distinguish same-symbol instruments. }
        value: { type: string, description: Exact decimal reporting-currency value. }
        percentage: { type: string, description: Exact two-decimal percentage apportioned by largest remainder; displayed percentages reconcile to 100. }
    CurrencyAllocation:
      type: object
      required: [currency, value, percentage]
      properties:
        currency: { type: string }
        value: { type: string, description: Exact decimal reporting-currency value grouped by original source currency. }
        percentage: { type: string, description: Exact two-decimal percentage apportioned by largest remainder; displayed percentages reconcile to 100. }
    Holding:
      type: object
      required: [lot_id, symbol, quantity, currency, freshness, data_quality, missing_broker, missing_acquisition_date]
      properties:
        lot_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        description: { type: string }
        quantity: { type: string, description: Decimal string. }
        currency: { type: string }
        unit_cost: { type: string, description: Decimal string. }
        cost_basis: { type: string, description: Decimal string. }
        latest_price: { type: string, description: Decimal string. }
        latest_value: { type: string, description: Decimal string. }
        reporting_value: { type: string, description: Decimal string; only meaningful when the snapshot is complete. }
        quote_source: { type: string }
        freshness: { $ref: '#/components/schemas/Freshness' }
        data_quality: { type: array, items: { type: string } }
        broker: { type: string }
        acquisition_date: { type: string }
        missing_broker: { type: boolean }
        missing_acquisition_date: { type: boolean }
        source_row: { type: integer }
    Freshness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [fresh, stale, missing, future, invalid] }
        market_at: { type: string, format: date-time }
        age: { type: string }
    ActivityPage:
      oneOf:
        - $ref: '#/components/schemas/ActivityPageMore'
        - $ref: '#/components/schemas/ActivityPageFinal'
    ActivityPageMore:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        next_cursor: { type: string, minLength: 16, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        has_more: { type: boolean, enum: [true] }
    ActivityPageFinal:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Activity' } }

        has_more: { type: boolean, enum: [false] }
    Activity:
      type: object
      additionalProperties: false
      required: [id, portfolio_id, action, category, actor_category, occurred_at, summary]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        portfolio_id: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 128 }
        category: { type: string, minLength: 1, maxLength: 64 }
        actor_category: { type: string, minLength: 1, maxLength: 64, description: Safe actor category; never a credential or username. }
        entity_type: { type: string, minLength: 1, maxLength: 128 }
        entity_id: { type: string, minLength: 1, maxLength: 128 }
        occurred_at: { type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{9}Z$' }
        summary: { type: string, minLength: 1, maxLength: 256 }
        details: { type: string, minLength: 1, maxLength: 2000 }
    ThesisUpdate:
      type: object
      additionalProperties: false
      required: [summary, intended_holding_period, reasons_to_hold, risks, reasons_to_sell, conditions_to_change, sources, expected_revision]
      properties:
        summary: { type: string, minLength: 1, maxLength: 4000 }
        intended_holding_period: { type: string, minLength: 1, maxLength: 256 }
        allocation_limit: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,2})([.][0-9]{1,2})?$', description: Exact decimal percentage, inclusive from 0 to 100; canonical responses remove insignificant zeroes. }
        reasons_to_hold: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        risks: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        reasons_to_sell: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        conditions_to_change: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        sources: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/ThesisSource' } }
        expected_revision: { type: integer, minimum: 0 }
    ThesisSource:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 256 }
        url: { type: string, format: uri, minLength: 1, maxLength: 2048 }
        publication_date: { type: string, nullable: true, format: date }
    Thesis:
      type: object
      additionalProperties: false
      required: [id, portfolio_id, holding_id, instrument_id, summary, intended_holding_period, reasons_to_hold, risks, reasons_to_sell, conditions_to_change, sources, revision, revision_id, updated_at]
      properties:
        id: { type: string }
        portfolio_id: { type: string }
        holding_id: { type: string }
        instrument_id: { type: string }
        summary: { type: string, minLength: 1, maxLength: 4000 }
        intended_holding_period: { type: string, minLength: 1, maxLength: 256 }
        allocation_limit: { type: string, nullable: true, pattern: '^(0|[1-9][0-9]{0,2})([.][0-9]{1,2})?$', description: Exact decimal percentage. }
        reasons_to_hold: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        reasons_to_sell: { type: array, items: { type: string } }
        conditions_to_change: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/ThesisSource' } }
        revision: { type: integer, minimum: 1 }
        revision_id: { type: string }
        updated_at: { type: string, format: date-time }
    ThesisRevision:
      allOf:
        - $ref: '#/components/schemas/Thesis'
        - type: object
          required: [created_at]
          properties:
            created_at: { type: string, format: date-time }
    ThesisHistory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ThesisRevision' } }
