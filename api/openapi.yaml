openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: 1.1.0-phase-d-contract
  license: { name: MIT, url: 'https://opensource.org/license/mit/' }
  description: >-
    Shipped runtime contract for authenticated portfolio-scoped holdings,
    immutable valuation snapshots, editable investment theses, and the Phase D
    scoped advisory review contract. Holding create/archive handlers, their
    authenticated frontend controls, runtime migration loading, and startup
    initialization are shipped. The
    Runtime behavior has no portfolio-document import, bootstrap import, or
    import preview/apply/status surface and starts with an empty
    portfolio-default. The baseline runtime's importer, source identity,
    readmodel/export/frontend consumers are known removal/replacement work, not
    acceptable target architecture for future UI slices.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Start an authenticated session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials or throttled login }
        '403': { description: Cross-origin request rejected }
  /api/v1/auth/session:
    get:
      summary: Bootstrap the current session
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { description: No valid session }
  /api/v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Session ended }
        '401': { description: No valid session }
        '403': { description: Invalid CSRF token or cross-origin request }
  /api/v1/portfolios/{portfolioId}/overview:
    get:
      summary: Read one portfolio overview
      description: Returns canonical database holdings and the latest immutable snapshot in the target runtime. Reporting currency changes only this read view. The initialized portfolio-default returns 200 with an empty holdings list and explicit no_snapshot state before the first holding is created.
      operationId: getPortfolioOverview
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: string }
        - name: currency
          in: query
          required: false
          description: Three-letter reporting currency; defaults to MYR.
          schema: { type: string, pattern: '^[A-Za-z]{3}$', default: MYR, example: USD }
      responses:
        '200':
          description: Portfolio overview. A no_snapshot or incomplete state is explicit and does not include a fabricated total.
          headers:
            ETag: { description: Exact portfolio holdings revision used as If-Match by holding mutations, schema: { type: string, minLength: 5, maxLength: 140, pattern: '^"[A-Za-z0-9][A-Za-z0-9._~-]{0,127}-[0-9]+"$' } }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Vary: { $ref: '#/components/headers/PrivateVary' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioOverview' }
              example:
                portfolio: { id: portfolio-default, name: Portfolio, default_reporting_currency: MYR }
                reporting_currency: MYR
                snapshot: { state: no_snapshot, complete: false, missing_dependencies: [], stale_dependencies: [], invalid_dependencies: [], subtotals: [] }
                allocation: { state: unavailable, coverage: { total_lots: 0, valued_lots: 0, missing_dependencies: 0, stale_dependencies: 0, invalid_dependencies: 0 }, by_instrument: [], by_source_currency: [] }
                holdings: []
        '400':
          description: Invalid reporting currency.
        '401':
          description: Authentication is required. The response is never cacheable.
        '403':
          description: Cross-origin or CSRF validation failed.
        '404':
          description: A non-default portfolio or API route was not found. The initialized portfolio-default does not return 404.
        '405':
          description: Read-only endpoint does not accept mutation methods.
        '500':
          description: Internal server error.
  /api/v1/portfolios/{portfolioId}/activity:
    get:
      summary: Read authenticated portfolio activity
      description: Returns safe, portfolio-scoped activity summaries in deterministic newest-first order. Raw audit payloads are never returned.
      operationId: getPortfolioActivity
      security: [{ sessionCookie: [] }]
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque signed cursor returned by the previous page. It encodes the occurred_at/id keyset position.
          schema: { type: string, minLength: 16, maxLength: 512 }
      responses:
        '200': { description: Activity page, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '400': { description: Malformed or out-of-bounds pagination }
        '401': { description: Authentication is required; response is never cacheable }
        '404': { description: Portfolio or API route not found }
        '405': { description: Read-only endpoint does not accept mutation methods }
        '500': { description: Internal server error }
  /api/v1/portfolios/{portfolioId}/holdings:
    post:
      summary: Create one active holding lot
      description: >-
        Creates one lot through the same portfolio-scoped store operation used
        by the browser and the explicitly authorized Hermes machine principal.
        Browser calls use the authenticated session, strict same-origin Origin,
        and session-bound CSRF. Machine calls use the exact configured bearer
        scope and require portfolio:read plus holdings:write. All decimal and
        date values are canonical strings; no JSON number is accepted.
      operationId: createPortfolioHolding
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { $ref: '#/components/schemas/IdempotencyKey' } }
        - { name: If-Match, in: header, required: true, description: Exact ETag returned by the portfolio overview read. Browser callers additionally send Origin and X-CSRF-Token; machine callers must not send a CSRF value., schema: { type: string, minLength: 5, maxLength: 140, pattern: '^"[A-Za-z0-9][A-Za-z0-9._~-]{0,127}-[0-9]+"$' } }
        - { name: Origin, in: header, required: false, description: Required for browser callers and must exactly equal the configured application origin; ignored only for a valid machine bearer., schema: { type: string, format: uri, maxLength: 512 } }
        - { name: X-CSRF-Token, in: header, required: false, description: Required for browser callers and bound to the authenticated session; forbidden for machine callers., schema: { type: string, minLength: 32, maxLength: 512 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldingCreateRequest' }
            example:
              instrument: { instrument_id: instrument-demo-001 }
              quantity: '12.5000'
              unit_cost: '10.00'
              cost_basis: '125.0000'
              currency: USD
              account_id: account-demo-001
              acquisition_date: '2026-01-15'
      responses:
        '201':
          description: Holding committed atomically and is active.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Vary: { $ref: '#/components/headers/PrivateVary' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            Location: { description: Canonical holding URL, schema: { type: string, maxLength: 512 } }
            ETag: { description: New exact portfolio revision witness, schema: { type: string, minLength: 5, maxLength: 140, pattern: '^"[A-Za-z0-9][A-Za-z0-9._~-]{0,127}-[0-9]+"$' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldingMutationReceipt' }
              example:
                operation: create
                result: applied
                holding: { portfolio_id: demo-portfolio, holding_id: lot-demo-002, instrument_id: instrument-demo-001, symbol: DEMO, quantity: '12.5000', unit_cost: '10.00', cost_basis: '125.0000', currency: USD, account_id: account-demo-001, acquisition_date: '2026-01-15', lifecycle: active, created_at: '2026-01-15T08:00:00.000000000Z', removed_at: null }
                portfolio_revision: 8
                snapshot_state: stale
                current_snapshot_id: snap-2026-01-15
                actor: { category: machine, id: hermes-holdings-writer, permissions: [portfolio:read, holdings:write] }
                audit_event_id: audit-holding-002
                activity_event_id: activity-holding-002
                idempotency_key: create-demo-idem-001
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/HoldingScopeNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedPost' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}:
    delete:
      summary: Logically remove one active holding lot
      description: >-
        Archives the active lot without deleting it. Immutable snapshots,
        reviews, review targets, theses/history, Activity, and audit records
        remain addressable. A new valuation snapshot is required before the
        portfolio can be current again. DELETE defines no application request
        body and is exempt from the 256 KiB JSON mutation-body limit. A
        non-empty DELETE body is deterministically rejected as invalid input;
        it is not interpreted as a payload and this operation does not
        advertise 413. Transport/server defensive limits remain independent.
      operationId: removePortfolioHolding
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: holdingId, in: path, required: true, schema: { $ref: '#/components/schemas/HoldingId' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { $ref: '#/components/schemas/IdempotencyKey' } }
        - { name: If-Match, in: header, required: true, description: Exact ETag returned by the portfolio overview read. Browser callers additionally send Origin and X-CSRF-Token; machine callers must not send a CSRF value., schema: { type: string, minLength: 5, maxLength: 140, pattern: '^"[A-Za-z0-9][A-Za-z0-9._~-]{0,127}-[0-9]+"$' } }
        - { name: Origin, in: header, required: false, description: Required for browser callers and must exactly equal the configured application origin; ignored only for a valid machine bearer., schema: { type: string, format: uri, maxLength: 512 } }
        - { name: X-CSRF-Token, in: header, required: false, description: Required for browser callers and bound to the authenticated session; forbidden for machine callers., schema: { type: string, minLength: 32, maxLength: 512 } }
      responses:
        '200':
          description: Holding archived atomically, or the stored receipt for an idempotent replay.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Vary: { $ref: '#/components/headers/PrivateVary' }
            X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
            ETag: { description: New exact portfolio revision witness, schema: { type: string, minLength: 5, maxLength: 140, pattern: '^"[A-Za-z0-9][A-Za-z0-9._~-]{0,127}-[0-9]+"$' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldingMutationReceipt' }
              example:
                operation: remove
                result: applied
                holding: { portfolio_id: demo-portfolio, holding_id: lot-demo-001, instrument_id: instrument-demo-001, symbol: DEMO, quantity: '12.5000', unit_cost: '10.00', cost_basis: '125.0000', currency: USD, account_id: null, acquisition_date: '2026-01-15', lifecycle: removed, created_at: '2026-01-15T08:00:00.000000000Z', removed_at: '2026-01-16T08:00:00.000000000Z' }
                portfolio_revision: 9
                snapshot_state: stale
                current_snapshot_id: snap-2026-01-15
                actor: { category: browser_user, id: local-owner, permissions: [portfolio:read] }
                audit_event_id: audit-holding-003
                activity_event_id: activity-holding-003
                idempotency_key: remove-demo-idem-001
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/HoldingScopeNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedDelete' }
        '409': { $ref: '#/components/responses/MutationConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/export.csv:
    get:
      summary: Download a portfolio-scoped CSV overview
      description: >-
        Returns the same immutable, canonical holding overview read model as the
        authenticated overview endpoint, encoded as deterministic RFC 4180 CSV.
        Each lot is one row, including duplicate symbols. Decimal fields are
        copied as exact strings and blank optional values remain blank. Text
        cells beginning with spreadsheet formula characters or leading
        whitespace/control characters are prefixed with an apostrophe; decimal
        and canonical date fields are classified separately. Columns, in
        order, are portfolio_id, portfolio_name, reporting_currency,
        snapshot_state, snapshot_id, calculation_version, snapshot_as_of,
        snapshot_created_at, snapshot_complete, lot_id, symbol, name,
        description, quantity, source_currency, unit_cost, cost_basis,
        latest_price, latest_value, reporting_value, quote_source,
        market_timestamp, freshness_state, freshness_age, broker,
        acquisition_date, missing_broker,
        missing_acquisition_date, and data_quality_flags. The response is
        private and never cacheable; it contains no thesis, credentials,
        account secrets, session/CSRF values, or raw audit metadata.
      operationId: exportPortfolioCSV
      security: [{ sessionCookie: [] }]
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: currency
          in: query
          required: true
          description: Supported uppercase reporting currency. Duplicate and unknown query parameters are rejected.
          schema: { type: string, enum: [MYR, USD, SGD, JPY], pattern: '^(MYR|USD|SGD|JPY)$' }
      responses:
        '200':
          description: UTF-8 RFC 4180 CSV attachment, one row per holding lot.
          headers:
            Content-Disposition: { description: Safe deterministic attachment filename, schema: { type: string } }
            Cache-Control: { description: Always no-store for private data, schema: { type: string, enum: [no-store] } }
            X-Content-Type-Options: { description: MIME sniffing protection, schema: { type: string, enum: [nosniff] } }
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { description: 'Missing, unsupported, duplicate, unknown, or non-canonical currency query' }
        '401': { description: Authentication is required; response is never cacheable }
        '404': { description: Portfolio or API route not found }
        '405': { description: Read-only endpoint does not accept mutation methods }
        '500': { description: Internal server error before any CSV bytes are sent }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}/thesis:
    get:
      summary: Read the current investment thesis for a holding
      operationId: getHoldingThesis
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200': { description: Current thesis, content: { application/json: { schema: { $ref: '#/components/schemas/Thesis' } } } }
        '401': { description: Authentication is required; response is never cacheable }
        '404': { description: 'Portfolio, holding, or thesis not found' }
    put:
      summary: Create or replace a holding investment thesis
      operationId: putHoldingThesis
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThesisUpdate' }
      responses:
        '200': { description: Accepted current thesis, content: { application/json: { schema: { $ref: '#/components/schemas/Thesis' } } } }
        '400': { description: Strict request or field validation failed }
        '401': { description: Authentication is required }
        '403': { description: Invalid CSRF token or cross-origin request }
        '404': { description: Portfolio or holding not found }
        '409': { description: Optimistic concurrency conflict }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}/thesis/history:
    get:
      summary: Read immutable thesis revision history
      operationId: getHoldingThesisHistory
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: holdingId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200': { description: Oldest-first immutable revisions, content: { application/json: { schema: { $ref: '#/components/schemas/ThesisHistory' } } } }
        '401': { description: Authentication is required }
        '404': { description: 'Portfolio, holding, or thesis not found' }
  /api/v1/portfolios/{portfolioId}/snapshots/latest:
    get:
      summary: Read the latest immutable review snapshot
      description: >-
        Returns the latest committed snapshot for this portfolio, including
        explicit incomplete data states. The response is private and must
        include no-store, Vary: Cookie, and X-Content-Type-Options: nosniff.
        Machine callers need portfolio:read; browser callers use the existing
        authenticated session.
      operationId: getLatestReviewSnapshot
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
      responses:
        '200':
          description: Latest immutable snapshot, or an explicit no_snapshot state.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewSnapshot' }, example: { portfolio_id: demo-portfolio, snapshot_id: snap-2026-01-15, calculation_version: valuation-v3, state: complete, created_at: '2026-01-15T08:00:00.000000000Z', as_of: '2026-01-15T07:55:00.000000000Z', complete: true, missing_dependencies: [], stale_dependencies: [], invalid_dependencies: [], holdings: [{ portfolio_id: demo-portfolio, snapshot_id: snap-2026-01-15, holding_id: lot-demo-001, instrument_id: instrument-demo-001, symbol: DEMO, name: Synthetic Example Corp, quantity: '12.5000', currency: USD, unit_cost: '10.00', cost_basis: '125.0000', latest_price: '11.00', latest_value: '137.5000', reporting_value: '185.6250', quote_source: synthetic-feed, market_at: '2026-01-15T07:55:00.000000000Z', freshness_state: fresh, freshness_age_seconds: '300' }] } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PortfolioNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGet' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/snapshots/{snapshotId}:
    get:
      summary: Read one exact immutable review snapshot
      description: A historical snapshot remains addressable after newer snapshots exist.
      operationId: getReviewSnapshot
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: snapshotId, in: path, required: true, schema: { $ref: '#/components/schemas/SnapshotId' } }
      responses:
        '200':
          description: Exact immutable snapshot.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewSnapshot' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SnapshotNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGet' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/holdings/{holdingId}/review-context:
    get:
      summary: Read one holding and instrument review context
      description: >-
        Returns only the selected portfolio lot, its instrument identity and
        safe valuation fields from the requested immutable snapshot. Account
        names, broker credentials, account numbers, theses and other
        portfolios are excluded.
      operationId: getReviewHoldingContext
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: holdingId, in: path, required: true, schema: { $ref: '#/components/schemas/HoldingId' } }
        - { name: snapshot_id, in: query, required: true, schema: { $ref: '#/components/schemas/SnapshotId' } }
      responses:
        '200':
          description: Portfolio-isolated review context.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewHoldingContext' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/HoldingOrSnapshotNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGet' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/reviews:
    get:
      summary: List immutable advisory reviews
      operationId: listAdvisoryReviews
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, description: Opaque signed keyset cursor bound to this portfolio, schema: { type: string, minLength: 16, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: holding_id, in: query, required: false, schema: { $ref: '#/components/schemas/HoldingId' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ReviewStatus' } }
        - { name: outdated, in: query, required: false, description: Lifecycle filter; this is separate from stored status., schema: { type: boolean } }
      responses:
        '200':
          description: Reviews in deterministic submitted_at descending, review_id descending wire order (review_id is the database id).
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PortfolioNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGetPost' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/IncompleteReview' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Submit one immutable advisory review
      description: >-
        Machine-only advisory write. Requires reviews:write and portfolio:read,
        an idempotency key, one exact snapshot and an explicit scope. It never
        changes holdings, theses, snapshots, prices, accounts or trades.
      operationId: submitAdvisoryReview
      security:
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSubmission' }
            example: { snapshot_id: snap-2026-01-15, calculation_version: valuation-v3, scope: { type: holding, holding_ids: [lot-demo-001], instrument_ids: [instrument-demo-001] }, status: complete, recommendation: hold, rationale: Synthetic evidence supports continued observation., risks: [Synthetic risk text.], counterarguments: [Synthetic counterargument.], conditions: [Review after the next dated snapshot.], metrics: [{ name: reporting_value, value: '185.6250', unit: reporting_currency, as_of: '2026-01-15T07:55:00.000000000Z', source: snapshot, deterministic: true }], sourced_facts: [{ statement: Synthetic sourced fact., evidence_ids: [evidence-demo-001] }], model_opinion: Synthetic model opinion., evidence: [{ evidence_id: evidence-demo-001, url: 'https://example.test/source/demo-001', title: Synthetic source, published_at: '2026-01-14T00:00:00.000000000Z', accessed_at: '2026-01-15T08:00:00.000000000Z', availability: available, freshness: current, excerpt: Synthetic excerpt treated as untrusted data. }], model: { provider: local-ai-server, model: synthetic-review-model, version: '2026-01', runtime: hermes-environment }, generated_at: '2026-01-15T08:00:00.000000000Z' }
      responses:
        '201':
          description: Review committed atomically and is immutable.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }, Location: { description: Canonical review URL, schema: { type: string, maxLength: 512 } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/PortfolioSnapshotOrTargetNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGetPost' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/IncompleteReview' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/reviews/{reviewId}:
    get:
      summary: Read one immutable advisory review
      operationId: getAdvisoryReview
      security:
        - sessionCookie: []
        - machineBearer: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: reviewId, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewId' } }
      responses:
        '200':
          description: Historical review, with deterministic current-snapshot comparison.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } , Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedBearer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReviewNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedGet' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/reviews/{reviewId}/feedback:
    post:
      summary: Record attributable human feedback
      description: >-
        Browser-session-only append-only feedback. Feedback is an event and
        never edits review content or records a trade. Requires same-origin
        cookie-session CSRF protection.
      operationId: recordReviewFeedback
      security:
        - sessionCookie: []
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: reviewId, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewId' } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 512 } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackSubmission' }, example: { decision: agree, note: Synthetic human note. } } }
      responses:
        '201':
          description: Append-only feedback event.
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewFeedback' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReviewNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowedPost' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/portfolios/{portfolioId}/market-data:
    get:
      summary: Read authenticated market-data setup
      description: Returns human-readable active portfolio instruments, explicit current mappings, and provider readiness booleans. Provider secrets are never returned.
      operationId: getMarketDataSetup
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Market-data setup and optimistic-concurrency tag.
          headers: { ETag: { schema: { type: string } }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MarketDataSetup' } } }
        '401': { $ref: '#/components/responses/UnauthorizedCookie' }
        '404': { description: Portfolio not found }
        '405': { $ref: '#/components/responses/MethodNotAllowedGet' }

  /api/v1/portfolios/{portfolioId}/market-data/mappings:
    post:
      summary: Save exact provider mappings as one revisioned batch
      description: Atomic append-only mapping submission. Exact provider identity is required; symbols are never guessed or silently reused.
      operationId: saveMarketMappings
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MappingBatchRequest' } } }
      responses:
        '200': { description: Complete batch save, content: { application/json: { schema: { $ref: '#/components/schemas/MappingBatchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { description: Mapping setup changed; reload before saving }
        '405': { $ref: '#/components/responses/MethodNotAllowedPost' }

  /api/v1/portfolios/{portfolioId}/market-data/refresh:
    post:
      summary: Refresh prices and create an immutable snapshot
      description: >-
        Performs the bounded provider refresh and immutable snapshot action for
        one authenticated portfolio. The idempotency receipt is persisted in
        SQLite with an actor/portfolio/operation/key namespace and canonical
        request fingerprint. A committed same-key replay returns the exact
        receipt without another provider call; a changed request is a conflict.
        Incomplete values remain explicit and are never presented as zero or a
        complete total. Provider errors and quote/FX missing, stale, invalid or
        future dependencies are returned as human-diagnosable classifications.
      operationId: refreshMarketData
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: portfolioId, in: path, required: true, schema: { $ref: '#/components/schemas/PortfolioId' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketRefreshRequest' } } }
      responses:
        '200': { description: Provider status and complete/incomplete immutable snapshot status, content: { application/json: { schema: { $ref: '#/components/schemas/MarketRefreshResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/UnauthorizedCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowedPost' }
        '409': { description: 'Same key with a different fingerprint, or an already-running receipt; no provider or snapshot success is claimed.' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portfolio_session
      description: >-
        Existing HttpOnly SameSite=Strict browser session. Unsafe requests
        require X-CSRF-Token plus same-origin Origin/Referer validation.
    machineBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Opaque machine credential for the fixed Hermes principal. The token is
        injected into the Hermes environment, compared in constant time, and
        never stored in SQLite, returned, logged, placed in a URL, or exposed
        to browser code. Holding mutations require the separately configured
        holdings:write permission in addition to portfolio:read. It is disabled
        by default and is not implied by reviews:write.
  headers:
    NoStore:
      description: Private responses are never stored by shared or browser caches.
      schema: { type: string, enum: [no-store] }
    PrivateVary:
      description: Session-authenticated responses vary by cookie.
      schema: { type: string, enum: [Cookie] }
    NoSniff:
      description: Prevent MIME sniffing on private API responses.
      schema: { type: string, enum: [nosniff] }
  responses:
    BadRequest:
      description: Malformed path/query/header/body, unknown field, duplicate ID, or invariant violation.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/InvalidRequestError' }, example: { error: { code: invalid_request, message: Request does not satisfy the API contract., request_id: req-demo-001 } } } }
    UnauthorizedBearer:
      description: Missing, malformed, expired, revoked, or invalid credentials on a machine-only or dual-auth operation; this deterministic response advertises the supported bearer scheme.
      headers: { WWW-Authenticate: { description: Bearer challenge for machine-capable requests, schema: { type: string, enum: ['Bearer realm="portfolio-dashboard"'] } }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/UnauthorizedError' }, example: { error: { code: unauthorized, message: Authentication is required., request_id: req-demo-401 } } } }
    UnauthorizedCookie:
      description: Missing, malformed, expired, or revoked browser session on the browser-only feedback operation; no bearer challenge is emitted.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/UnauthorizedError' }, example: { error: { code: unauthorized, message: A browser session is required., request_id: req-demo-401-cookie } } } }
    Forbidden:
      description: Valid identity lacks the required permission, portfolio binding fails, or cookie CSRF/origin validation fails.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ForbiddenError' } } }
    MethodNotAllowedGet:
      description: Known canonical GET-only path with an unsupported method.
      headers:
        Allow:
          description: >-
            Exact canonical methods for this path, emitted only after
            authentication and authorization.
          schema: { type: string, enum: [GET] }
          example: GET
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Vary: { $ref: '#/components/headers/PrivateVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
      content: { application/json: { schema: { $ref: '#/components/schemas/MethodNotAllowedError' } } }
    MethodNotAllowedGetPost:
      description: Known reviews collection path with an unsupported method.
      headers:
        Allow:
          description: >-
            Exact canonical methods for the reviews collection, emitted only
            after authentication and authorization.
          schema: { type: string, enum: ['GET, POST'] }
          example: 'GET, POST'
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Vary: { $ref: '#/components/headers/PrivateVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
      content: { application/json: { schema: { $ref: '#/components/schemas/MethodNotAllowedError' } } }
    MethodNotAllowedPost:
      description: Known feedback path with an unsupported method.
      headers:
        Allow:
          description: >-
            Exact canonical POST method for the feedback path, emitted only
            after authentication and authorization.
          schema: { type: string, enum: [POST] }
          example: POST
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Vary: { $ref: '#/components/headers/PrivateVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
      content: { application/json: { schema: { $ref: '#/components/schemas/MethodNotAllowedError' } } }
    MethodNotAllowedDelete:
      description: Known holding resource path with an unsupported method.
      headers:
        Allow:
          description: Exact canonical DELETE method for the holding resource.
          schema: { type: string, enum: [DELETE] }
          example: DELETE
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Vary: { $ref: '#/components/headers/PrivateVary' }
        X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' }
      content: { application/json: { schema: { $ref: '#/components/schemas/MethodNotAllowedError' } } }
    PortfolioNotFound:
      description: Portfolio does not exist; cross-portfolio existence is not disclosed.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    SnapshotNotFound:
      description: Snapshot does not exist or is not owned by this portfolio.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    HoldingOrSnapshotNotFound:
      description: Holding, snapshot, or portfolio association does not exist.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    HoldingScopeNotFound:
      description: Portfolio, account, instrument, or holding is absent or is not valid in this portfolio.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    PortfolioSnapshotOrTargetNotFound:
      description: Portfolio, exact snapshot, or explicitly named review target does not exist in this portfolio.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    ReviewNotFound:
      description: Review does not exist or is not owned by this portfolio.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/NotFoundError' } } }
    IdempotencyConflict:
      description: Key was used with a different request fingerprint, or the immutable operation conflicts with an existing record.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/IdempotencyConflictError' } } }
    MutationConflict:
      description: >-
        The portfolio revision witness is stale, the idempotency key has a
        different request fingerprint, or the target is already archived.
        The response never reveals another principal's request body.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/MutationConflictError' } } }
    PayloadTooLarge:
      description: 'A mutation endpoint that defines an application request body exceeded the 256 KiB JSON limit. Archive DELETE defines no application body and is exempt; transport/server defensive limits are separate and are not represented by this response.'
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/PayloadTooLargeError' } } }
    UnsupportedMediaType:
      description: Content-Type is not exactly application/json (parameters permitted).
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/UnsupportedMediaTypeError' } } }
    IncompleteReview:
      description: Evidence is missing, unavailable, stale beyond policy, invalid, or the snapshot cannot support a recommendation; no fabricated recommendation is accepted.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/IncompleteReviewError' } } }
    InternalError:
      description: Safe generic server failure; details are available only in redacted server logs by request ID.
      headers: { Cache-Control: { $ref: '#/components/headers/NoStore' }, Vary: { $ref: '#/components/headers/PrivateVary' }, X-Content-Type-Options: { $ref: '#/components/headers/NoSniff' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/InternalErrorResponse' } } }
  schemas:
    ProviderReadiness:
      type: object
      additionalProperties: false
      required: [name, configured, public]
      properties:
        name: { type: string, enum: [alpha_vantage, coingecko, finnhub, open_exchange_rates] }
        configured: { type: boolean }
        public: { type: boolean }
    MarketMapping:
      type: object
      additionalProperties: false
      required: [provider, provider_symbol, quote_currency, active_from]
      properties:
        provider: { type: string, enum: [alpha_vantage, coingecko, finnhub, open_exchange_rates] }
        provider_symbol: { type: string, minLength: 1, maxLength: 128 }
        quote_currency: { type: string, pattern: '^[A-Z]{3}$' }
        active_from: { $ref: '#/components/schemas/CanonicalDateTime' }
        provenance: { type: string, maxLength: 256 }
    MarketInstrument:
      type: object
      additionalProperties: false
      required: [instrument_id, symbol, currency, mappings]
      properties:
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        symbol: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 256 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        mappings: { type: array, items: { $ref: '#/components/schemas/MarketMapping' } }
    MarketDataSetup:
      type: object
      additionalProperties: false
      required: [portfolio_id, etag, providers, instruments]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        etag: { type: string, minLength: 1, maxLength: 256 }
        providers: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ProviderReadiness' } }
        instruments: { type: array, items: { $ref: '#/components/schemas/MarketInstrument' } }
    MappingBatchItem:
      type: object
      additionalProperties: false
      required: [instrument_id, provider, provider_symbol, quote_currency, provenance, confirm_unverified]
      properties:
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        provider: { type: string, enum: [alpha_vantage, coingecko, finnhub] }
        provider_symbol: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}$' }
        quote_currency: { type: string, pattern: '^[A-Z]{3}$' }
        provenance: { type: string, minLength: 1 }
        confirm_unverified: { type: boolean, enum: [true] }
    MappingBatchRequest:
      type: object
      required: [mappings]
      additionalProperties: false
      properties:
        mappings: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/MappingBatchItem' } }
    MappingBatchResult:
      type: object
      additionalProperties: false
      required: [status, etag, outcomes]
      properties:
        status: { type: string, enum: [saved] }
        etag: { type: string }
        outcomes: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/MappingBatchOutcome' } }
    MappingBatchOutcome:
      type: object
      additionalProperties: false
      required: [instrument_id, status, mapping]
      properties:
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        status: { type: string, enum: [saved] }
        mapping: { $ref: '#/components/schemas/ProviderMapping' }
    ProviderMapping:
      type: object
      additionalProperties: false
      required: [id, instrument_id, provider, provider_symbol, quote_currency, active_from, provenance, created_at]
      properties:
        id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        provider: { type: string, enum: [alpha_vantage, coingecko, finnhub] }
        provider_symbol: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}$' }
        quote_currency: { type: string, pattern: '^[A-Z]{3}$' }
        active_from: { $ref: '#/components/schemas/CanonicalDateTime' }
        provenance: { type: string, minLength: 1, maxLength: 256 }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
    MarketRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        reporting_currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    MarketRefreshResult:
      type: object
      additionalProperties: false
      required: [refresh, snapshot, complete, freshness_policy]
      properties:
        refresh: { $ref: '#/components/schemas/RefreshResult' }
        snapshot: { $ref: '#/components/schemas/SnapshotStatus' }
        complete: { type: boolean }
        freshness_policy: { type: string }
        missing_instruments: { type: array, items: { type: string } }
    RefreshResult:
      type: object
      additionalProperties: false
      required: [refresh_id, portfolio_id, status, started_at, ended_at, providers]
      properties:
        refresh_id: { $ref: '#/components/schemas/RefreshId' }
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        status: { type: string, enum: [complete, incomplete] }
        started_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        ended_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        observation_ids: { type: array, maxItems: 4096, uniqueItems: true, items: { $ref: '#/components/schemas/ObservationId' } }
        providers: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ProviderRefreshStatus' } }
    ProviderRefreshStatus:
      type: object
      additionalProperties: false
      required: [provider, status, request_count, succeeded_count, failed_count, missing_mapping_count]
      properties:
        provider: { type: string, enum: [alpha_vantage, coingecko, finnhub, open_exchange_rates] }
        status: { type: string, enum: [complete, incomplete] }
        request_count: { type: integer, minimum: 0, maximum: 1000000 }
        succeeded_count: { type: integer, minimum: 0, maximum: 1000000 }
        failed_count: { type: integer, minimum: 0, maximum: 1000000 }
        missing_mapping_count: { type: integer, minimum: 0, maximum: 1000000 }
        observation_ids: { type: array, maxItems: 4096, uniqueItems: true, items: { $ref: '#/components/schemas/ObservationId' } }
        errors: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 128 } }
    SnapshotStatus:
      type: object
      additionalProperties: false
      required: [snapshot_id, portfolio_id, calculation_version, created_at, as_of, complete, reporting_currency, currencies, subtotals, missing_count, stale_count, invalid_count, missing_dependencies, stale_dependencies, invalid_dependencies, quote_ids, fx_ids, source_timestamps, presentation_timezone]
      properties:
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        as_of: { $ref: '#/components/schemas/CanonicalDateTime' }
        complete: { type: boolean }
        reporting_currency: { type: string, pattern: '^[A-Z]{3}$' }
        reporting_total: { $ref: '#/components/schemas/DecimalString' }
        currencies: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[A-Z]{3}$' } }
        subtotals: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SnapshotSubtotal' } }
        missing_count: { type: integer, minimum: 0, maximum: 1000000 }
        stale_count: { type: integer, minimum: 0, maximum: 1000000 }
        invalid_count: { type: integer, minimum: 0, maximum: 1000000 }
        missing_dependencies: { type: array, maxItems: 10000, items: { type: string, minLength: 1, maxLength: 256 } }
        stale_dependencies: { type: array, maxItems: 10000, items: { type: string, minLength: 1, maxLength: 256 } }
        invalid_dependencies: { type: array, maxItems: 10000, items: { type: string, minLength: 1, maxLength: 256 } }
        quote_ids: { type: array, maxItems: 10000, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        fx_ids: { type: array, maxItems: 10000, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
        source_timestamps: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/CanonicalDateTime' } }
        presentation_timezone: { type: string, minLength: 1, maxLength: 64 }
    SnapshotSubtotal:
      type: object
      additionalProperties: false
      required: [currency, market_value]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        market_value: { $ref: '#/components/schemas/DecimalString' }
        cost_basis: { $ref: '#/components/schemas/DecimalString' }
        unrealised_pnl: { type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
    PortfolioId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    SnapshotId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    RefreshId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    ObservationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    HoldingId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    InstrumentId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    ReviewId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$'
    CanonicalDateTime:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{9}Z$'
      description: Canonical UTC timestamp used by normalized Phase D storage; exactly nine fractional digits and Z.
    ReviewStatus:
      type: string
      enum: [complete, incomplete]
    Recommendation:
      type: string
      enum: [hold, review, trim_candidate, exit_candidate, no_recommendation]
    ReviewScope:
      oneOf:
        - $ref: '#/components/schemas/PortfolioReviewScope'
        - $ref: '#/components/schemas/HoldingReviewScope'
      description: >-
        Explicit branches prevent portfolio scopes from carrying targets and
        require non-empty unique target arrays for holding scopes. The server
        additionally enforces exact 1:1 holding/instrument correspondence and
        membership in the requested snapshot.
    PortfolioReviewScope:
      type: object
      additionalProperties: false
      required: [type, holding_ids, instrument_ids]
      properties:
        type: { type: string, enum: [portfolio] }
        holding_ids: { type: array, minItems: 0, maxItems: 0, items: { $ref: '#/components/schemas/HoldingId' } }
        instrument_ids: { type: array, minItems: 0, maxItems: 0, items: { $ref: '#/components/schemas/InstrumentId' } }
    HoldingReviewScope:
      type: object
      additionalProperties: false
      required: [type, holding_ids, instrument_ids]
      properties:
        type: { type: string, enum: [holding] }
        holding_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/HoldingId' } }
        instrument_ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: '#/components/schemas/InstrumentId' } }
    DecimalString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^-?(?:0|[1-9][0-9]*)(?:[.][0-9]+)?$'
      description: Canonical base-10 decimal string; never a JSON number or SQLite REAL.
    EvidenceUrl:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      pattern: '^https://(?=[^/?]{1,253}(?:[/?]|$))[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*(?:[/?][A-Za-z0-9._~:/?$&''()*+,;=%!-]*)?$'
      description: >-
        Canonical HTTPS URL accepted by the Go net/url store boundary. Host
        labels are lowercase ASCII DNS labels (1-63 bytes, total at most 253);
        userinfo, explicit ports, fragments, whitespace and controls are not
        accepted. The suffix is empty or begins with / or ? and is at most the
        remaining URL budget.
    ReviewSnapshot:
      oneOf:
        - { $ref: '#/components/schemas/ReviewSnapshotComplete' }
        - { $ref: '#/components/schemas/ReviewSnapshotIncomplete' }
        - { $ref: '#/components/schemas/ReviewSnapshotNoSnapshot' }
      description: No snapshot is represented explicitly; it has no fabricated identity or values.
    ReviewSnapshotComplete:
      type: object
      additionalProperties: false
      required: [portfolio_id, snapshot_id, calculation_version, state, created_at, as_of, complete, missing_dependencies, stale_dependencies, invalid_dependencies, holdings]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        state: { type: string, enum: [complete] }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        as_of: { $ref: '#/components/schemas/CanonicalDateTime' }
        complete: { type: boolean, enum: [true] }
        missing_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        stale_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        invalid_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        holdings: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/ReviewHoldingContext' } }
    ReviewSnapshotIncomplete:
      type: object
      additionalProperties: false
      required: [portfolio_id, snapshot_id, calculation_version, state, created_at, as_of, complete, missing_dependencies, stale_dependencies, invalid_dependencies, holdings]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        state: { type: string, enum: [incomplete] }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        as_of: { $ref: '#/components/schemas/CanonicalDateTime' }
        complete: { type: boolean, enum: [false] }
        missing_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        stale_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        invalid_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        holdings: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/ReviewHoldingContext' } }
    ReviewSnapshotNoSnapshot:
      type: object
      additionalProperties: false
      required: [portfolio_id, state, complete, missing_dependencies, stale_dependencies, invalid_dependencies, holdings]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        state: { type: string, enum: [no_snapshot] }
        complete: { type: boolean, enum: [false] }
        missing_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        stale_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        invalid_dependencies: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 } }
        holdings: { type: array, maxItems: 0, items: { type: object } }
    ReviewHoldingContext:
      type: object
      additionalProperties: false
      required: [portfolio_id, snapshot_id, holding_id, instrument_id, symbol, name, quantity, currency, freshness_state]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        holding_id: { $ref: '#/components/schemas/HoldingId' }
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        symbol: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 256 }
        quantity: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        unit_cost: { $ref: '#/components/schemas/DecimalString' }
        cost_basis: { $ref: '#/components/schemas/DecimalString' }
        latest_price: { $ref: '#/components/schemas/DecimalString' }
        latest_value: { $ref: '#/components/schemas/DecimalString' }
        reporting_value: { $ref: '#/components/schemas/DecimalString' }
        quote_source: { type: string, minLength: 1, maxLength: 128 }
        market_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        freshness_state: { type: string, enum: [fresh, stale, missing, future, invalid] }
        freshness_age_seconds: { $ref: '#/components/schemas/DecimalString' }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
    Session:
      type: object
      required: [authenticated, csrf_token, expires_at]
      properties:
        authenticated: { type: boolean }
        csrf_token: { type: string, description: In-memory token for unsafe same-origin API requests. }
        expires_at: { $ref: '#/components/schemas/CanonicalDateTime' }
    PortfolioOverview:
      type: object
      required: [portfolio, reporting_currency, snapshot, allocation, holdings]
      properties:
        portfolio: { $ref: '#/components/schemas/Portfolio' }
        reporting_currency: { type: string, example: MYR }
        snapshot: { $ref: '#/components/schemas/Snapshot' }
        allocation: { $ref: '#/components/schemas/Allocation' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
    Portfolio:
      type: object
      required: [id, name, default_reporting_currency]
      properties:
        id: { type: string }
        name: { type: string }
        default_reporting_currency: { type: string }
    Snapshot:
      type: object
      required: [state, complete, subtotals]
      properties:
        state: { type: string, enum: [complete, incomplete, no_snapshot] }
        snapshot_id: { type: string }
        calculation_version: { type: string }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        as_of: { $ref: '#/components/schemas/CanonicalDateTime' }
        complete: { type: boolean }
        reporting_total: { type: string, description: Decimal string; present only when complete. }
        missing_dependencies: { type: array, items: { type: string } }
        stale_dependencies: { type: array, items: { type: string } }
        invalid_dependencies: { type: array, items: { type: string } }
        source_timestamps: { type: array, items: { $ref: '#/components/schemas/CanonicalDateTime' } }
        subtotals:
          type: array
          items: { $ref: '#/components/schemas/CurrencySubtotal' }
    CurrencySubtotal:
      type: object
      required: [currency, market_value]
      properties:
        currency: { type: string }
        market_value: { type: string }
        cost_basis: { type: string }
        unrealised_pnl: { type: string }
    Allocation:
      type: object
      required: [state, coverage]
      description: Complete distributions are emitted only when every lot has a reporting value. Partial and unavailable states omit distribution slices.
      properties:
        state: { type: string, enum: [complete, partial, unavailable] }
        coverage: { $ref: '#/components/schemas/AllocationCoverage' }
        by_instrument:
          type: array
          items: { $ref: '#/components/schemas/InstrumentAllocation' }
        by_source_currency:
          type: array
          items: { $ref: '#/components/schemas/CurrencyAllocation' }
    AllocationCoverage:
      type: object
      required: [total_lots, valued_lots, missing_dependencies, stale_dependencies, invalid_dependencies]
      properties:
        total_lots: { type: integer, minimum: 0 }
        valued_lots: { type: integer, minimum: 0 }
        missing_dependencies: { type: integer, minimum: 0 }
        stale_dependencies: { type: integer, minimum: 0 }
        invalid_dependencies: { type: integer, minimum: 0 }
    InstrumentAllocation:
      type: object
      required: [symbol, source_currency, value, percentage]
      properties:
        instrument_id: { type: string }
        symbol: { type: string }
        source_currency: { type: string, description: 'Original holding currency, included to distinguish same-symbol instruments.' }
        value: { type: string, description: Exact decimal reporting-currency value. }
        percentage: { type: string, description: Exact two-decimal percentage apportioned by largest remainder; displayed percentages reconcile to 100. }
    CurrencyAllocation:
      type: object
      required: [currency, value, percentage]
      properties:
        currency: { type: string }
        value: { type: string, description: Exact decimal reporting-currency value grouped by original source currency. }
        percentage: { type: string, description: Exact two-decimal percentage apportioned by largest remainder; displayed percentages reconcile to 100. }
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      description: 'Opaque retry key scoped to actor category, actor ID, portfolio, operation, and idempotency key; never a secret. The physical namespace has no separate route column: create and archive (the remove operation) are independent namespaces.'
    HoldingQuantity:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^(?:[1-9][0-9]*(?:[.][0-9]{1,18})?|0[.](?=[0-9]{1,18}$)[0-9]*[1-9][0-9]*)$'
      description: Positive canonical base-10 quantity, with at most 18 fractional digits.
    HoldingMoney:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^(?:0|[1-9][0-9]*)(?:[.][0-9]{1,18})?$'
      description: Non-negative canonical base-10 amount, with at most 18 fractional digits.
    HoldingCostBasis:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^(?:0|[1-9][0-9]*)(?:[.][0-9]{1,36})?$'
      description: Non-negative canonical base-10 exact product of quantity and unit cost, with at most 36 fractional digits and a bounded product length.
    InstrumentReference:
      type: object
      additionalProperties: false
      required: [instrument_id]
      properties:
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
      description: Existing instrument already associated with this portfolio.
    InlineInstrument:
      type: object
      additionalProperties: false
      required: [symbol, currency]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$' }
        description: { type: string, minLength: 1, maxLength: 256 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        asset_type: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        exchange: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
      description: Bounded new global instrument definition, associated with this portfolio in the same transaction.
    HoldingInstrumentInput:
      oneOf:
        - $ref: '#/components/schemas/InstrumentReference'
        - $ref: '#/components/schemas/InlineInstrument'
      description: Exactly one of instrument_id or the inline definition is accepted; sending both is invalid.
    HoldingCreateRequest:
      type: object
      additionalProperties: false
      required: [instrument, quantity, unit_cost, cost_basis, currency]
      properties:
        instrument: { $ref: '#/components/schemas/HoldingInstrumentInput' }
        quantity: { $ref: '#/components/schemas/HoldingQuantity' }
        unit_cost: { $ref: '#/components/schemas/HoldingMoney' }
        cost_basis: { $ref: '#/components/schemas/HoldingCostBasis' }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Must equal the instrument currency. }
        account_id: { type: string, nullable: true, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        acquisition_date: { type: string, format: date, nullable: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
      description: >-
        The server verifies exact quantity x unit_cost equals cost_basis at
        the declared decimal scale and rejects any non-canonical representation,
        including JSON numbers, exponent notation, leading zeroes, and negative values.
    HoldingRecord:
      type: object
      additionalProperties: false
      description: Public holding state intentionally excludes client or document provenance; mutation attribution is carried by the receipt actor and append-only audit/Activity identifiers.
      required: [portfolio_id, holding_id, instrument_id, symbol, quantity, unit_cost, cost_basis, currency, account_id, acquisition_date, lifecycle, created_at, removed_at]
      properties:
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        holding_id: { $ref: '#/components/schemas/HoldingId' }
        instrument_id: { $ref: '#/components/schemas/InstrumentId' }
        symbol: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, minLength: 1, maxLength: 256 }
        quantity: { $ref: '#/components/schemas/HoldingQuantity' }
        unit_cost: { $ref: '#/components/schemas/HoldingMoney' }
        cost_basis: { $ref: '#/components/schemas/HoldingCostBasis' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        account_id: { type: string, nullable: true, minLength: 1, maxLength: 128 }
        acquisition_date: { type: string, format: date, nullable: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        lifecycle: { type: string, enum: [active, removed] }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        removed_at: { type: string, format: date-time, nullable: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{9}Z$' }
    MutationActor:
      type: object
      additionalProperties: false
      required: [category, id, permissions]
      properties:
        category: { type: string, enum: [browser_user, machine] }
        id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        permissions: { type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: { type: string, enum: [portfolio:read, holdings:write] } }
      description: Immutable safe attribution captured by the mutation; no credential material is included.
    HoldingMutationReceipt:
      type: object
      additionalProperties: false
      required: [operation, result, holding, portfolio_revision, snapshot_state, current_snapshot_id, actor, audit_event_id, activity_event_id, idempotency_key]
      properties:
        operation: { type: string, enum: [create, remove] }
        result: { type: string, enum: [applied, replayed] }
        holding: { $ref: '#/components/schemas/HoldingRecord' }
        portfolio_revision: { type: integer, minimum: 1 }
        snapshot_state: { type: string, enum: [stale, no_snapshot] }
        current_snapshot_id: { type: string, nullable: true, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        actor: { $ref: '#/components/schemas/MutationActor' }
        audit_event_id: { type: string, minLength: 1, maxLength: 128 }
        activity_event_id: { type: string, minLength: 1, maxLength: 128 }
        idempotency_key: { $ref: '#/components/schemas/IdempotencyKey' }
      description: >-
        The receipt is safe to persist and replay. It contains no bearer,
        session, CSRF, secret, or raw request payload.
    MutationConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string, enum: [stale_revision, idempotency_conflict, holding_not_active] }
            message: { type: string, minLength: 1, maxLength: 256 }
            request_id: { type: string, minLength: 1, maxLength: 128 }
    Holding:
      type: object
      required: [lot_id, symbol, quantity, currency, freshness, data_quality, missing_broker, missing_acquisition_date]
      properties:
        lot_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        description: { type: string }
        quantity: { $ref: '#/components/schemas/HoldingQuantity' }
        currency: { type: string }
        unit_cost: { $ref: '#/components/schemas/HoldingMoney' }
        cost_basis: { $ref: '#/components/schemas/HoldingCostBasis' }
        latest_price: { type: string, description: Decimal string. }
        latest_value: { type: string, description: Decimal string. }
        reporting_value: { type: string, description: Decimal string; only meaningful when the snapshot is complete. }
        quote_source: { type: string }
        freshness: { $ref: '#/components/schemas/Freshness' }
        data_quality: { type: array, items: { type: string } }
        broker: { type: string }
        acquisition_date: { type: string }
        missing_broker: { type: boolean }
        missing_acquisition_date: { type: boolean }
    Freshness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [fresh, stale, missing, future, invalid] }
        market_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        age: { type: string }
    ActivityPage:
      oneOf:
        - $ref: '#/components/schemas/ActivityPageMore'
        - $ref: '#/components/schemas/ActivityPageFinal'
    ActivityPageMore:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        next_cursor: { type: string, minLength: 16, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
        has_more: { type: boolean, enum: [true] }
    ActivityPageFinal:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Activity' } }

        has_more: { type: boolean, enum: [false] }
    Activity:
      type: object
      additionalProperties: false
      required: [id, portfolio_id, action, category, actor_category, occurred_at, summary]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        portfolio_id: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 128 }
        category: { type: string, minLength: 1, maxLength: 64 }
        actor_category: { type: string, minLength: 1, maxLength: 64, description: Safe actor category; never a credential or username. }
        entity_type: { type: string, minLength: 1, maxLength: 128 }
        entity_id: { type: string, minLength: 1, maxLength: 128 }
        occurred_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        summary: { type: string, minLength: 1, maxLength: 256 }
        details: { type: string, minLength: 1, maxLength: 2000 }
    ThesisUpdate:
      type: object
      additionalProperties: false
      required: [summary, intended_holding_period, reasons_to_hold, risks, reasons_to_sell, conditions_to_change, sources, expected_revision]
      properties:
        summary: { type: string, minLength: 1, maxLength: 4000 }
        intended_holding_period: { type: string, minLength: 1, maxLength: 256 }
        allocation_limit: { $ref: '#/components/schemas/AllocationLimit' }
        reasons_to_hold: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        risks: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        reasons_to_sell: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        conditions_to_change: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 1000 } }
        sources: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/ThesisSource' } }
        expected_revision: { type: integer, minimum: 0 }
    ThesisSource:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 256 }
        url: { type: string, format: uri, minLength: 1, maxLength: 2048 }
        publication_date: { type: string, nullable: true, format: date }
    Thesis:
      type: object
      additionalProperties: false
      required: [id, portfolio_id, holding_id, instrument_id, summary, intended_holding_period, reasons_to_hold, risks, reasons_to_sell, conditions_to_change, sources, revision, revision_id, updated_at]
      properties:
        id: { type: string }
        portfolio_id: { type: string }
        holding_id: { type: string }
        instrument_id: { type: string }
        summary: { type: string, minLength: 1, maxLength: 4000 }
        intended_holding_period: { type: string, minLength: 1, maxLength: 256 }
        allocation_limit: { $ref: '#/components/schemas/AllocationLimit' }
        reasons_to_hold: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        reasons_to_sell: { type: array, items: { type: string } }
        conditions_to_change: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/ThesisSource' } }
        revision: { type: integer, minimum: 1 }
        revision_id: { type: string }
        updated_at: { $ref: '#/components/schemas/CanonicalDateTime' }
    AllocationLimit:
      type: string
      nullable: true
      description: Exact decimal percentage, inclusive from 0 to 100. Canonical responses remove insignificant zeroes.
      pattern: '^(?:0|[1-9]?[0-9](?:[.][0-9]{1,2})?|100(?:[.]0{1,2})?)$'
    ThesisRevision:
      type: object
      additionalProperties: false
      required: [id, portfolio_id, holding_id, instrument_id, summary, intended_holding_period, reasons_to_hold, risks, reasons_to_sell, conditions_to_change, sources, revision, revision_id, updated_at, created_at]
      properties:
        id: { type: string }
        portfolio_id: { type: string }
        holding_id: { type: string }
        instrument_id: { type: string }
        summary: { type: string, minLength: 1, maxLength: 4000 }
        intended_holding_period: { type: string, minLength: 1, maxLength: 256 }
        allocation_limit: { $ref: '#/components/schemas/AllocationLimit' }
        reasons_to_hold: { type: array, items: { type: string } }
        risks: { type: array, items: { type: string } }
        reasons_to_sell: { type: array, items: { type: string } }
        conditions_to_change: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/ThesisSource' } }
        revision: { type: integer, minimum: 1 }
        revision_id: { type: string }
        updated_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        created_at: { $ref: '#/components/schemas/CanonicalDateTime' }
    ThesisHistory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ThesisRevision' } }
    ReviewMetric:
      type: object
      additionalProperties: false
      required: [name, value, unit, as_of, source, deterministic]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        value: { $ref: '#/components/schemas/DecimalString' }
        unit: { type: string, minLength: 1, maxLength: 64 }
        as_of: { $ref: '#/components/schemas/CanonicalDateTime' }
        source: { type: string, enum: [snapshot, calculation, submitted] }
        deterministic: { type: boolean, enum: [true] }
      description: Deterministic metric copied from the named immutable snapshot or calculation; not model output.
    ReviewEvidence:
      type: object
      additionalProperties: false
      required: [evidence_id, url, title, accessed_at, availability, freshness, excerpt]
      properties:
        evidence_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        url: { $ref: '#/components/schemas/EvidenceUrl' }
        title: { type: string, minLength: 1, maxLength: 512 }
        published_at: { type: string, format: date-time, nullable: true, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{9}Z$' }
        accessed_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        availability: { type: string, enum: [available, unavailable, blocked, invalid] }
        freshness: { type: string, enum: [current, stale, unknown] }
        excerpt: { type: string, minLength: 1, maxLength: 4000 }
      description: >-
        URL, title and excerpt are untrusted data. Only HTTPS is accepted;
        HTML is not accepted and the content never supplies instructions or
        authority to Hermes. An unavailable, blocked, invalid, stale or
        unknown evidence item cannot support a complete recommendation.
    SourcedFact:
      type: object
      additionalProperties: false
      required: [statement, evidence_ids]
      properties:
        statement: { type: string, minLength: 1, maxLength: 2000 }
        evidence_ids: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
      description: A plain-text factual statement whose support must resolve to submitted evidence IDs.
    ModelProvenance:
      type: object
      additionalProperties: false
      required: [provider, model, version, runtime]
      properties:
        provider: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        model: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9][A-Za-z0-9._~:/-]*$' }
        version: { type: string, minLength: 1, maxLength: 128 }
        runtime: { type: string, enum: [hermes-environment] }
      description: Non-secret local-AI provenance only; no token, endpoint, prompt or credential is accepted.
    ReviewSubmission:
      oneOf:
        - $ref: '#/components/schemas/CompleteReviewSubmission'
        - $ref: '#/components/schemas/IncompleteReviewSubmission'
      description: >-
        The server verifies the exact snapshot and calculation version, target
        membership and evidence references. If data or evidence is unknown,
        stale beyond policy, missing or invalid, status must be incomplete and
        recommendation must be no_recommendation; otherwise the request is
        rejected with incomplete_review.
    ReviewSubmissionCommon:
      type: object
      additionalProperties: false
      required: [snapshot_id, calculation_version, scope, status, recommendation, rationale, risks, counterarguments, conditions, metrics, sourced_facts, model_opinion, evidence, model, generated_at]
      properties:
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        scope: { $ref: '#/components/schemas/ReviewScope' }
        status: { type: string, enum: [complete, incomplete] }
        recommendation: { $ref: '#/components/schemas/Recommendation' }
        rationale: { type: string, minLength: 1, maxLength: 8000 }
        risks: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        counterarguments: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        conditions: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        metrics: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReviewMetric' } }
        sourced_facts: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SourcedFact' } }
        model_opinion: { type: string, minLength: 1, maxLength: 8000 }
        evidence: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/ReviewEvidence' } }
        model: { $ref: '#/components/schemas/ModelProvenance' }
        generated_at: { $ref: '#/components/schemas/CanonicalDateTime' }
    CompleteReviewSubmission:
      allOf:
        - $ref: '#/components/schemas/ReviewSubmissionCommon'
        - type: object
          properties:
            status: { type: string, enum: [complete] }
            recommendation: { type: string, enum: [hold, review, trim_candidate, exit_candidate] }
            evidence: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/CurrentAvailableEvidence' } }
            sourced_facts: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/SourcedFact' } }
    IncompleteReviewSubmission:
      allOf:
        - $ref: '#/components/schemas/ReviewSubmissionCommon'
        - type: object
          properties:
            status: { type: string, enum: [incomplete] }
            recommendation: { type: string, enum: [no_recommendation] }
    CurrentAvailableEvidence:
      allOf:
        - $ref: '#/components/schemas/ReviewEvidence'
        - type: object
          properties:
            availability: { type: string, enum: [available] }
            freshness: { type: string, enum: [current] }
    Review:
      oneOf:
        - $ref: '#/components/schemas/CompleteReview'
        - $ref: '#/components/schemas/IncompleteReview'
      description: Output branches are mutually exclusive and preserve the same completeness invariants as submission.
    CompleteReview:
      type: object
      additionalProperties: false
      required: [review_id, portfolio_id, snapshot_id, calculation_version, scope, status, recommendation, rationale, risks, counterarguments, conditions, metrics, sourced_facts, model_opinion, evidence, model, generated_at, submitted_at, submitted_by, lifecycle]
      properties:
        review_id: { $ref: '#/components/schemas/ReviewId' }
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        scope: { $ref: '#/components/schemas/ReviewScope' }
        status: { type: string, enum: [complete] }
        recommendation: { type: string, enum: [hold, review, trim_candidate, exit_candidate] }
        rationale: { type: string, minLength: 1, maxLength: 8000 }
        risks: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        counterarguments: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        conditions: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        metrics: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReviewMetric' } }
        sourced_facts: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/SourcedFact' } }
        model_opinion: { type: string, minLength: 1, maxLength: 8000 }
        evidence: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/CurrentAvailableEvidence' } }
        model: { $ref: '#/components/schemas/ModelProvenance' }
        generated_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        submitted_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        submitted_by: { $ref: '#/components/schemas/PrincipalAttribution' }
        lifecycle: { $ref: '#/components/schemas/ReviewLifecycle' }
    IncompleteReview:
      type: object
      additionalProperties: false
      required: [review_id, portfolio_id, snapshot_id, calculation_version, scope, status, recommendation, rationale, risks, counterarguments, conditions, metrics, sourced_facts, model_opinion, evidence, model, generated_at, submitted_at, submitted_by, lifecycle]
      properties:
        review_id: { $ref: '#/components/schemas/ReviewId' }
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        calculation_version: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        scope: { $ref: '#/components/schemas/ReviewScope' }
        status: { type: string, enum: [incomplete] }
        recommendation: { type: string, enum: [no_recommendation] }
        rationale: { type: string, minLength: 1, maxLength: 8000 }
        risks: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        counterarguments: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        conditions: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 2000 } }
        metrics: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ReviewMetric' } }
        sourced_facts: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SourcedFact' } }
        model_opinion: { type: string, minLength: 1, maxLength: 8000 }
        evidence: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/ReviewEvidence' } }
        model: { $ref: '#/components/schemas/ModelProvenance' }
        generated_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        submitted_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        submitted_by: { $ref: '#/components/schemas/PrincipalAttribution' }
        lifecycle: { $ref: '#/components/schemas/ReviewLifecycle' }
    ReviewLifecycle:
      oneOf:
        - $ref: '#/components/schemas/ReviewLifecycleNoCurrent'
        - $ref: '#/components/schemas/ReviewLifecycleCurrent'
        - $ref: '#/components/schemas/ReviewLifecycleOutdated'
      description: >-
        Normatively, outdated is false iff current_snapshot_id is null or
        equals the review snapshot_id, and true iff a non-null current snapshot
        differs. JSON Schema cannot compare IDs, so the server enforces the
        equality branch at runtime.
    ReviewLifecycleNoCurrent:
      type: object
      additionalProperties: false
      required: [historical_status, current_snapshot_id, outdated]
      properties:
        historical_status: { type: string, enum: [complete, incomplete] }
        current_snapshot_id: { type: string, nullable: true, minLength: 1, maxLength: 0 }
        outdated: { type: boolean, enum: [false] }
    ReviewLifecycleCurrent:
      type: object
      additionalProperties: false
      required: [historical_status, current_snapshot_id, outdated]
      properties:
        historical_status: { type: string, enum: [complete, incomplete] }
        current_snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        outdated: { type: boolean, enum: [false] }
      description: current_snapshot_id equals the review snapshot_id.
    ReviewLifecycleOutdated:
      type: object
      additionalProperties: false
      required: [historical_status, current_snapshot_id, outdated]
      properties:
        historical_status: { type: string, enum: [complete, incomplete] }
        current_snapshot_id: { $ref: '#/components/schemas/SnapshotId' }
        outdated: { type: boolean, enum: [true] }
      description: current_snapshot_id differs from the review snapshot_id.
    PrincipalAttribution:
      type: object
      additionalProperties: false
      required: [principal_id, principal_type, permissions]
      properties:
        principal_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]*$' }
        principal_type: { type: string, enum: [browser_user, machine] }
        permissions: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [portfolio:read, reviews:write, holdings:write] } }
      description: >-
        Immutable effective permissions captured at authentication time. A
        machine review attribution always has reviews:write as its primary
        permission and may include portfolio:read only when that same active
        portfolio-bound principal had it enabled. A browser attribution is the
        stable local-owner principal with the fixed portfolio:read permission;
        callers cannot claim arbitrary or currently disabled permissions.
    ReviewPage:
      oneOf:
        - $ref: '#/components/schemas/ReviewPageFinal'
        - $ref: '#/components/schemas/ReviewPageMore'
    ReviewPageFinal:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Review' } }
        has_more: { type: boolean, enum: [false] }
    ReviewPageMore:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Review' } }
        has_more: { type: boolean, enum: [true] }
        next_cursor: { type: string, minLength: 16, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [agree, disagree, defer, request_another_review] }
        note: { type: string, minLength: 1, maxLength: 2000, nullable: true }
      description: >-
        Human event only. The note may be omitted or JSON null; both
        canonicalize to null before fingerprinting and the response uses
        note:null. A present string is plain escaped text and cannot modify a
        review or create a trade.
    ReviewFeedback:
      type: object
      additionalProperties: false
      required: [feedback_id, portfolio_id, review_id, decision, note, occurred_at, submitted_by]
      properties:
        feedback_id: { type: string, minLength: 1, maxLength: 128 }
        portfolio_id: { $ref: '#/components/schemas/PortfolioId' }
        review_id: { $ref: '#/components/schemas/ReviewId' }
        decision: { type: string, enum: [agree, disagree, defer, request_another_review] }
        note: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
        occurred_at: { $ref: '#/components/schemas/CanonicalDateTime' }
        submitted_by: { $ref: '#/components/schemas/PrincipalAttribution' }
    InvalidRequestError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [invalid_request] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    UnauthorizedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [unauthorized] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    ForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [forbidden] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    NotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [not_found] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    MethodNotAllowedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [method_not_allowed] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    IdempotencyConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [idempotency_conflict] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    PayloadTooLargeError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [payload_too_large] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    UnsupportedMediaTypeError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [unsupported_media_type] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    IncompleteReviewError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [incomplete_review] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
    InternalErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: object, additionalProperties: false, required: [code, message, request_id], properties: { code: { type: string, enum: [internal_error] }, message: { type: string, minLength: 1, maxLength: 256 }, request_id: { type: string, minLength: 1, maxLength: 128 } } }
