services:
  portfolio-dashboard:
    image: ghcr.io/boubonming/portfolio-dashboard:main
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "${PORTFOLIO_HOST_IP:-127.0.0.1}:${PORTFOLIO_HOST_PORT:-8080}:8080"
    volumes:
      - "portfolio-data:/data"
    env_file:
      - "../.env"
    environment:
      PORTFOLIO_BIND_ADDRESS: "0.0.0.0:8080"
      PORTFOLIO_DATA_PATH: "/data/portfolio-dashboard.sqlite"
      PORTFOLIO_ENV: "production"
      PORTFOLIO_COOKIE_SECURE: "true"
      PORTFOLIO_PUBLIC_ORIGIN: "${PORTFOLIO_PUBLIC_ORIGIN:?set the exact HTTPS public origin}"
      PORTFOLIO_AUTH_USERNAME: "${PORTFOLIO_AUTH_USERNAME:?set the login username}"
      PORTFOLIO_AUTH_PASSWORD_HASH: "${PORTFOLIO_AUTH_PASSWORD_HASH:?set a bcrypt password hash}"
      PORTFOLIO_SESSION_SECRET: "${PORTFOLIO_SESSION_SECRET:?set an independent random session secret}"
      PORTFOLIO_REPORTING_CURRENCY: "${PORTFOLIO_REPORTING_CURRENCY:-MYR}"
      PORTFOLIO_MACHINE_PRINCIPAL_ID: "${PORTFOLIO_MACHINE_PRINCIPAL_ID:-}"
      PORTFOLIO_MACHINE_PORTFOLIO_ID: "${PORTFOLIO_MACHINE_PORTFOLIO_ID:-}"
      PORTFOLIO_MACHINE_PORTFOLIO_READ: "${PORTFOLIO_MACHINE_PORTFOLIO_READ:-false}"
      PORTFOLIO_MACHINE_REVIEWS_WRITE: "${PORTFOLIO_MACHINE_REVIEWS_WRITE:-false}"
      PORTFOLIO_MACHINE_HOLDINGS_WRITE: "${PORTFOLIO_MACHINE_HOLDINGS_WRITE:-false}"
      PORTFOLIO_MACHINE_MARKET_REFRESH: "${PORTFOLIO_MACHINE_MARKET_REFRESH:-false}"
    healthcheck:
      test: ["CMD", "/app/portfolio-dashboard", "healthcheck", "-url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  portfolio-data:
